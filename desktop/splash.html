<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>声格 VoiceGrid</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #090a0b;
      --panel: #111315;
      --raised: #181b1e;
      --text: #f4f6f8;
      --muted: #9aa2ad;
      --border: #2a2e33;
      --accent: #f3ff00;
      --on-accent: #090a0b;
      --danger: #ff5c67;
      --font: "Segoe UI Variable", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--canvas); color: var(--text); font-family: var(--font); }
    button { color: inherit; font: inherit; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { width: 100%; height: 100%; display: grid; grid-template-rows: 56px minmax(0, 1fr); background: radial-gradient(circle at 80% 16%, rgb(243 255 0 / 8%), transparent 30%), var(--canvas); }
    .titlebar { display: flex; align-items: center; border-bottom: 1px solid var(--border); background: rgb(17 19 21 / 94%); user-select: none; }
    .drag { min-width: 0; height: 100%; flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 14px; -webkit-app-region: drag; }
    .drag img { width: 30px; height: 30px; }
    .brand { display: grid; line-height: 1.15; }
    .brand strong { font-size: 13px; letter-spacing: .04em; }
    .brand span { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .window-controls { align-self: stretch; display: flex; border-left: 1px solid var(--border); -webkit-app-region: no-drag; }
    .window-controls button { width: 48px; border: 0; background: transparent; cursor: pointer; }
    .window-controls button:hover { background: var(--raised); }
    .window-controls .close:hover { background: var(--danger); color: #fff; }
    .window-controls svg { width: 17px; height: 17px; pointer-events: none; }
    main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, .75fr); gap: clamp(48px, 8vw, 128px); align-items: center; padding: clamp(48px, 8vw, 120px); }
    .identity { align-self: center; max-width: 760px; }
    .kicker { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .kicker::before { content: ""; width: 26px; height: 2px; background: var(--accent); }
    h1 { max-width: 720px; margin: 24px 0 20px; font-size: clamp(48px, 5.8vw, 88px); line-height: .98; letter-spacing: -.055em; }
    h1 span { color: var(--muted); font-weight: 480; }
    .identity p { max-width: 640px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .startup-card { width: 100%; max-width: 520px; justify-self: end; border: 1px solid var(--border); border-radius: 16px; padding: 24px; background: rgb(17 19 21 / 92%); box-shadow: 0 28px 80px rgb(0 0 0 / 32%); }
    .card-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
    .card-head span { display: block; color: var(--muted); font-size: 11px; }
    .card-head strong { display: block; margin-top: 4px; font-size: 20px; }
    .pulse { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 7px rgb(243 255 0 / 10%); animation: breathe 1.6s ease-in-out infinite; }
    .segments { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin: 24px 0 18px; }
    .segments i { height: 3px; border-radius: 99px; background: var(--border); transition: background 180ms ease, opacity 180ms ease; }
    .segments i.done { background: var(--accent); }
    .segments i.current { background: var(--accent); animation: segment 1.1s ease-in-out infinite; }
    .stage { min-height: 48px; }
    .stage strong { display: block; font-size: 14px; }
    .stage span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .diagnostic { display: none; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 18px; }
    .diagnostic.visible { display: block; }
    .diagnostic p { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { min-height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 0 13px; background: var(--raised); cursor: pointer; }
    .actions button:hover { border-color: var(--muted); }
    .actions .primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; }
    .actions .danger { color: var(--danger); }
    .foot { margin-top: 22px; display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font: 11px "Cascadia Mono", Consolas, monospace; }
    @keyframes breathe { 50% { opacity: .45; transform: scale(.82); } }
    @keyframes segment { 50% { opacity: .35; } }
    @media (max-width: 1080px) {
      main { grid-template-columns: 1fr; gap: 40px; align-content: center; overflow: auto; }
      .startup-card { max-width: none; justify-self: stretch; }
      h1 { font-size: clamp(44px, 8vw, 70px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="drag pywebview-drag-region">
        <img src="./assets/voicegrid-icon-accent.svg" alt="声格 VoiceGrid" />
        <div class="brand"><strong id="build-product">声格 VoiceGrid</strong><span id="build-attribution">制作信息加载中</span></div>
      </div>
      <div class="window-controls">
        <button type="button" aria-label="最小化" data-action="minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14" /></svg>
        </button>
        <button type="button" class="close" aria-label="退出" data-action="exit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
    </header>
    <main>
      <section class="identity">
        <span class="kicker">Local Voice Production</span>
        <h1>让声音先醒来，<br /><span>模型稍后就绪。</span></h1>
        <p>正在准备本地项目、音色资产与离线服务。MOSS-TTS 1.5 4B 仍会保持懒加载，只有开始生成时才进入显存。</p>
      </section>
      <section class="startup-card" aria-labelledby="startup-title" aria-busy="true">
        <div class="card-head">
          <div><span>STARTUP SEQUENCE</span><strong id="startup-title">正在启动工作台</strong></div>
          <i class="pulse" aria-hidden="true"></i>
        </div>
        <div class="segments" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="stage" role="status" aria-live="polite">
          <strong id="stage-name">正在创建桌面窗口</strong>
          <span id="stage-detail">窗口控制已经可用，后台服务将在独立线程中继续准备。</span>
        </div>
        <div class="diagnostic" id="diagnostic">
          <p id="diagnostic-copy">启动时间超出预期。可以继续等待，或打开日志查看具体阶段。</p>
          <div class="actions">
            <button type="button" class="primary" id="continue">继续等待</button>
            <button type="button" id="retry">重试</button>
            <button type="button" id="logs">打开日志</button>
            <button type="button" class="danger" data-action="exit">退出</button>
          </div>
        </div>
        <div class="foot"><span id="build-version">开发版</span><span id="elapsed">准备中</span></div>
      </section>
    </main>
  </div>
  <script>
    Promise.all([
      fetch("../build.json").then((response) => response.json()),
      fetch("./splash-identity.json").then((response) => response.json()),
    ]).then(([build, identity]) => {
      const displayVersion = String(build.version || "").split("-")[0].split(".").slice(0, 2).join(".");
      document.title = build.product;
      document.getElementById("build-product").textContent = build.product;
      document.getElementById("build-attribution").textContent = `${identity.organization} · ${displayVersion} · 作者：${identity.author}`;
      document.getElementById("build-version").textContent = build.version;
    }).catch(() => {});
    const phases = ["shell", "backend_import", "database", "project_recovery", "api", "frontend", "ready"];
    const phaseNames = {
      shell: "正在创建桌面窗口",
      backend_import: "正在载入本地服务",
      database: "正在检查本地数据库",
      project_recovery: "正在恢复项目状态",
      api: "正在启动本地接口",
      frontend: "正在载入项目中心",
      ready: "工作台已就绪",
      slow: "启动时间超出预期",
      failed: "启动未能完成"
    };
    const segments = Array.from(document.querySelectorAll(".segments i"));
    const stageName = document.getElementById("stage-name");
    const stageDetail = document.getElementById("stage-detail");
    const diagnostic = document.getElementById("diagnostic");
    const diagnosticCopy = document.getElementById("diagnostic-copy");
    const elapsed = document.getElementById("elapsed");
    let polling = false;

    async function call(name, ...args) {
      const fn = window.pywebview?.api?.[name];
      if (!fn) return null;
      return await fn(...args);
    }

    function render(status) {
      const active = status.active_phase || status.phase || "shell";
      const index = Math.max(0, phases.indexOf(active));
      segments.forEach((item, itemIndex) => {
        item.classList.toggle("done", itemIndex < index || active === "ready");
        item.classList.toggle("current", itemIndex === index && active !== "ready");
      });
      stageName.textContent = phaseNames[status.phase] || phaseNames[active] || "正在准备工作台";
      stageDetail.textContent = status.detail || status.message || "正在准备本地服务。";
      elapsed.textContent = status.elapsed_ms >= 1000 ? `${(status.elapsed_ms / 1000).toFixed(1)} 秒` : `${status.elapsed_ms} 毫秒`;
      const showDiagnostic = status.phase === "slow" || status.phase === "failed";
      diagnostic.classList.toggle("visible", showDiagnostic);
      if (status.phase === "failed") diagnosticCopy.textContent = "启动过程中遇到错误。请重试，或打开日志查看可恢复的详细信息。";
      else diagnosticCopy.textContent = "启动时间超出预期。仍在执行的安全初始化不会被强制中止。";
      document.querySelector(".startup-card").setAttribute("aria-busy", String(status.phase !== "ready" && status.phase !== "failed"));
    }

    async function poll() {
      if (!polling) return;
      try {
        const status = await call("startup_status");
        if (status) render(status);
      } catch (_) { /* The native host owns error reporting. */ }
      window.setTimeout(poll, 100);
    }

    document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => call("window_action", button.dataset.action)));
    document.getElementById("continue").addEventListener("click", async () => render(await call("continue_waiting")));
    document.getElementById("retry").addEventListener("click", async () => render(await call("retry_startup")));
    document.getElementById("logs").addEventListener("click", () => call("open_log_folder"));
    window.addEventListener("pywebviewready", () => { polling = true; poll(); }, { once: true });
  </script>
</body>
</html>
